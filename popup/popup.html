<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PDD Local Publisher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>PDD 本地上货</h1>
      <span id="count">0 个任务</span>
    </header>

    <section class="card">
      <label class="file-button">
        ① 导入商品表
        <input id="file" type="file" accept=".csv,.json,text/csv,application/json" />
      </label>
      <button id="download-template" class="secondary">下载本地图片模板</button>
      <label class="file-button local-file-button">
        ② 批量选择本地图片
        <input id="batch-local-images" type="file" accept="image/*" multiple />
      </label>
      <p class="hint">先导入商品表，再选择电脑图片。扩展按照模板中的图片文件名自动匹配；也可以在下方每个商品中单独补图。</p>
    </section>

    <section class="actions">
      <button id="start">打开下一个商品</button>
      <button id="clear-completed" class="secondary">清除已完成</button>
    </section>

    <div id="message" role="status"></div>
    <main id="queue"><div class="empty">尚未导入商品。下载模板填写后，点击“① 导入商品表”。</div></main>
    <input id="local-images" type="file" accept="image/*" multiple hidden />

    <footer>
      <button id="export-log" class="link">导出日志</button>
      <button id="options" class="link">设置</button>
    </footer>

    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
